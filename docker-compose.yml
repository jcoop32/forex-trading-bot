# ============================================================================
# LOCAL DEVELOPMENT ONLY — NOT FOR PRODUCTION
# Production deployment uses Kubernetes manifests in k8s/ via Portainer.
# Use this file for local testing: docker compose up --build
# ============================================================================
services:
  trading-bot:
    build: .
    container_name: forex-trading-bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://forex:forexpassword@postgres:5432/forex
      - REDIS_URL=redis://redis:6379/0
      - LOG_DIR=/app/data
    volumes:
      - bot_data:/app/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: forex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=forex
      - POSTGRES_USER=forex
      - POSTGRES_PASSWORD=forexpassword
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: forex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  bot_data:
  postgres_data:
  redis_data:
